<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Gerador de Apoio — Enio + Nilto</title>
<style>
  :root { --red:#e30613; --ink:#111; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:#fff; }
  .wrap { width:min(1180px, 94vw); margin:0 auto; padding:28px 0 44px; }
  h1 { margin:0 0 6px; font-size:clamp(30px,5vw,56px); line-height:1; }
  .lead { margin:0 0 24px; font-size:17px; color:#555; }
  .grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(320px,420px); gap:28px; align-items:start; }
  .stage { background:#eee; border-radius:18px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.08); touch-action:none; }
  canvas { display:block; width:100%; aspect-ratio:4/5; background:#eee; cursor:grab; }
  canvas.dragging { cursor:grabbing; }
  .panel { display:flex; flex-direction:column; gap:14px; }
  .box { border:1px solid #e5e5e5; border-radius:16px; padding:16px; background:#fff; }
  .box h2 { font-size:16px; margin:0 0 12px; }
  .btn { width:100%; border:0; border-radius:12px; padding:14px 16px; font-weight:700; font-size:16px; cursor:pointer; }
  .btn-primary { background:var(--red); color:#fff; }
  .btn-secondary { background:#111; color:#fff; }
  input[type=file] { width:100%; }
  input[type=range] { width:100%; accent-color:var(--red); }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .hint { font-size:13px; color:#666; line-height:1.4; }
  .mini { font-size:12px; color:#777; }
  @media (max-width:850px) {
    .grid { grid-template-columns:1fr; }
    .panel { order:-1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Gerador de apoio</h1>
  <p class="lead">Envie sua foto, ajuste e baixe a arte pronta em 4:5.</p>

  <div class="grid">
    <div class="stage">
      <canvas id="canvas" width="1080" height="1350"></canvas>
    </div>

    <div class="panel">
      <div class="box">
        <h2>1. Envie sua foto</h2>
        <input id="file" type="file" accept="image/*">
        <p class="hint">Sua foto fica apenas no seu aparelho. Ela não é enviada para servidor.</p>
      </div>

      <div class="box">
        <div class="row"><h2 style="margin:0">2. Ajuste</h2><span id="zoomLabel" class="mini">Zoom 100%</span></div>
        <input id="zoom" type="range" min="100" max="320" value="100">
        <button id="center" class="btn btn-secondary" style="margin-top:10px">Centralizar foto</button>
        <p class="hint">Arraste a foto diretamente sobre a prévia para posicioná-la.</p>
      </div>

      <button id="download" class="btn btn-primary">Baixar minha arte</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('file');
const zoomInput = document.getElementById('zoom');
const zoomLabel = document.getElementById('zoomLabel');
const centerBtn = document.getElementById('center');
const downloadBtn = document.getElementById('download');

const base = new Image();
base.src = 'base-enio-nilto-circulo.png';

// Círculo central para a foto
const PHOTO_CX = 540;
const PHOTO_CY = 510;
const PHOTO_R = 205;
const PHOTO_BOX = { x: PHOTO_CX - PHOTO_R, y: PHOTO_CY - PHOTO_R, w: PHOTO_R * 2, h: PHOTO_R * 2 };

let photo = null;
let zoom = 1;
let baseScale = 1;
let offsetX = PHOTO_BOX.x;
let offsetY = PHOTO_BOX.y;
let dragging = false;
let isDownloading = false;
let lastX = 0, lastY = 0;

function drawPlaceholder() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#f2f2f2';
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function render() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (base.complete) {
    ctx.drawImage(base, 0, 0, canvas.width, canvas.height);
  } else {
    drawPlaceholder();
  }

  if (photo) {
    const scale = baseScale * zoom;
    ctx.save();
    ctx.beginPath();
    ctx.arc(PHOTO_CX, PHOTO_CY, PHOTO_R, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(photo, offsetX, offsetY, photo.width * scale, photo.height * scale);
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.arc(PHOTO_CX, PHOTO_CY, PHOTO_R, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 10;
    ctx.stroke();
    ctx.restore();
  } else if (!isDownloading) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(PHOTO_CX, PHOTO_CY, PHOTO_R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.lineWidth = 4;
    ctx.setLineDash([12,8]);
    ctx.stroke();
    ctx.restore();
  }
}

function resetPhotoPosition() {
  if (!photo) return;
  const cover = Math.max(PHOTO_BOX.w / photo.width, PHOTO_BOX.h / photo.height);
  baseScale = cover;
  zoom = parseInt(zoomInput.value,10) / 100;
  const scale = baseScale * zoom;
  offsetX = PHOTO_BOX.x + (PHOTO_BOX.w - photo.width * scale) / 2;
  offsetY = PHOTO_BOX.y + (PHOTO_BOX.h - photo.height * scale) / 2;
  render();
}

base.onload = render;
render();

fileInput.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;

  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      photo = img;
      zoomInput.value = 100;
      zoomLabel.textContent = 'Zoom 100%';
      resetPhotoPosition();
    };
    img.onerror = () => alert('Não foi possível abrir essa foto. Tente usar JPG ou PNG.');
    img.src = ev.target.result;
  };
  reader.onerror = () => alert('Não foi possível ler essa foto.');
  reader.readAsDataURL(f);
});

zoomInput.addEventListener('input', () => {
  if (!photo) return;
  const oldZoom = zoom;
  const oldScale = baseScale * oldZoom;
  const cx = PHOTO_CX;
  const cy = PHOTO_CY;
  const imageCx = (cx - offsetX) / oldScale;
  const imageCy = (cy - offsetY) / oldScale;

  zoom = parseInt(zoomInput.value,10) / 100;
  const newScale = baseScale * zoom;
  offsetX = cx - imageCx * newScale;
  offsetY = cy - imageCy * newScale;
  zoomLabel.textContent = `Zoom ${zoomInput.value}%`;
  render();
});

centerBtn.addEventListener('click', resetPhotoPosition);

function pointFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {
    x: (t.clientX - r.left) * (canvas.width / r.width),
    y: (t.clientY - r.top) * (canvas.height / r.height)
  };
}
function startDrag(e) {
  if (!photo) return;
  e.preventDefault();
  dragging = true;
  canvas.classList.add('dragging');
  const p = pointFromEvent(e);
  lastX = p.x; lastY = p.y;
}
function moveDrag(e) {
  if (!dragging || !photo) return;
  e.preventDefault();
  const p = pointFromEvent(e);
  offsetX += p.x - lastX;
  offsetY += p.y - lastY;
  lastX = p.x; lastY = p.y;
  render();
}
function endDrag() {
  dragging = false;
  canvas.classList.remove('dragging');
}

canvas.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', moveDrag);
window.addEventListener('mouseup', endDrag);
canvas.addEventListener('touchstart', startDrag, {passive:false});
canvas.addEventListener('touchmove', moveDrag, {passive:false});
canvas.addEventListener('touchend', endDrag);

downloadBtn.addEventListener('click', () => {
  if (!photo) {
    alert('Envie uma foto antes de baixar.');
    return;
  }
  isDownloading = true;
  render();
  const a = document.createElement('a');
  a.download = 'arte-enio-nilto-circular.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  isDownloading = false;
  render();
});
</script>
</body>
</html>
